spring:
  profiles:
    active: local
  config:
    import: classpath:application-secret.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  access-token-validity-in-seconds: 1209600
  refresh-token-validity-in-seconds: 1209600

oauth2:
  kakao:
    token-uri: "https://kauth.kakao.com/oauth/token"
    user-info-uri: "https://kapi.kakao.com/v2/user/me"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: handoff

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  file:
    name: /app/logs/handoff.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB