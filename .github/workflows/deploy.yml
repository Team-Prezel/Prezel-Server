name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 설정 파일 생성
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF
          
          cat << 'EOF' > src/main/resources/application-secret.yml
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF

          cat << 'EOF' > src/main/resources/firebase-adminsdk.json
          ${{ secrets.FIREBASE_ADMINSDK_JSON }}
          EOF

      - name: 프로젝트 빌드
        run: ./gradlew clean build -x test

      - name: Docker 이미지 빌드 및 푸시
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t audwns03/handoff .
          docker push audwns03/handoff

      - name: 모니터링 설정 파일 EC2 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "monitoring"
          target: "/home/ubuntu"

      - name: EC2에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
          
            # 1. 3000번 포트 방화벽 자동 허용 (OCI iptables)
            sudo iptables -C INPUT -p tcp --dport 3000 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 3000 -j ACCEPT || true
            sudo netfilter-persistent save 2>/dev/null || true

            # 2. handoff-net 네트워크 생성 (없을 경우)
            sudo docker network inspect handoff-net >/dev/null 2>&1 || sudo docker network create handoff-net

            # 3. 백엔드 배포
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull audwns03/handoff
            sudo docker stop handoff || true
            sudo docker rm -f handoff || true 
            sudo docker run -d --network handoff-net -p 80:8080 -e SPRING_PROFILES_ACTIVE=prod --name handoff audwns03/handoff
            sudo docker image prune -f

            # 4. 모니터링(Prometheus & Grafana) 컨테이너 자동 기동
            cd /home/ubuntu/monitoring
            if docker compose version >/dev/null 2>&1; then
              sudo docker compose -f docker-compose.monitoring.yml up -d
            else
              sudo docker-compose -f docker-compose.monitoring.yml up -d
            fi