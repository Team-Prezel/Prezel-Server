name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: yml 설정 파일 생성
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF
          
          cat << 'EOF' > src/main/resources/application-secret.yml
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF

      - name: 프로젝트 빌드
        run: ./gradlew clean build -x test

      - name: Docker 이미지 빌드 및 푸시
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t audwns03/handoff .
          docker push audwns03/handoff

      - name: EC2에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            sudo docker pull audwns03/handoff
            sudo docker stop handoff || true
            sudo docker rm -f handoff || true 
            
            sudo docker run -d -p 80:8080 -e SPRING_PROFILES_ACTIVE=prod --name handoff audwns03/handoff
            sudo docker image prune -f