name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 설정 파일 생성
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF
          
          cat << 'EOF' > src/main/resources/application-secret.yml
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF

          cat << 'EOF' > src/main/resources/firebase-adminsdk.json
          ${{ secrets.FIREBASE_ADMINSDK_JSON }}
          EOF

      - name: 프로젝트 빌드
        run: ./gradlew clean build -x test

      - name: Docker 이미지 빌드 및 푸시
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t audwns03/handoff .
          docker push audwns03/handoff

      - name: 모니터링 설정 파일 EC2 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "monitoring"
          target: "/home/ubuntu"

      - name: EC2에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
          
            # 1. 3000번 포트 방화벽 자동 허용 (OCI iptables)
            sudo iptables -C INPUT -p tcp --dport 3000 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 3000 -j ACCEPT || true
            sudo netfilter-persistent save 2>/dev/null || true

            # 2. handoff-net 네트워크 생성 (없을 경우)
            sudo docker network inspect handoff-net >/dev/null 2>&1 || sudo docker network create handoff-net

            # 3. 로그 디렉토리 생성 및 권한 부여
            mkdir -p /home/ubuntu/logs && sudo chmod 777 /home/ubuntu/logs

            # 4. 백엔드 배포
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull audwns03/handoff
            sudo docker stop handoff || true
            sudo docker rm -f handoff || true 
            sudo docker run -d \
              --name handoff \
              --network handoff-net \
              -p 80:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e LOGGING_FILE_NAME=/app/logs/handoff.log \
              -e LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE=10MB \
              -e LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY=7 \
              -e LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP=100MB \
              -v /home/ubuntu/logs:/app/logs \
              audwns03/handoff
            sudo docker image prune -f

            # 5. 모니터링(Prometheus & Grafana) 컨테이너 기동
            sudo docker stop prometheus || true
            sudo docker rm -f prometheus || true
            sudo docker run -d \
              --name prometheus \
              --restart unless-stopped \
              --network handoff-net \
              --memory 250M \
              -v /home/ubuntu/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
              -v prometheus_data:/prometheus \
              prom/prometheus:v2.51.2 \
              --config.file=/etc/prometheus/prometheus.yml \
              --storage.tsdb.path=/prometheus \
              --storage.tsdb.retention.time=7d \
              --storage.tsdb.retention.size=512MB \
              --web.enable-lifecycle

            sudo docker stop grafana || true
            sudo docker rm -f grafana || true
            sudo docker run -d \
              --name grafana \
              --restart unless-stopped \
              --network handoff-net \
              --memory 200M \
              -p 3000:3000 \
              -e GF_SECURITY_ADMIN_USER=admin \
              -e GF_SECURITY_ADMIN_PASSWORD=admin \
              -e GF_USERS_ALLOW_SIGN_UP=false \
              -v grafana_data:/var/lib/grafana \
              -v /home/ubuntu/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro \
              grafana/grafana:10.4.2

            # 6. 로깅(Loki & Promtail) 컨테이너 기동
            sudo docker stop loki || true
            sudo docker rm -f loki || true
            sudo docker run -d \
              --name loki \
              --restart unless-stopped \
              --network handoff-net \
              --memory 150M \
              -v /home/ubuntu/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro \
              -v loki_data:/loki \
              grafana/loki:2.9.8 \
              -config.file=/etc/loki/loki-config.yml

            sudo docker stop promtail || true
            sudo docker rm -f promtail || true
            sudo docker run -d \
              --name promtail \
              --restart unless-stopped \
              --network handoff-net \
              --memory 100M \
              -v /home/ubuntu/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro \
              -v /home/ubuntu/logs:/var/log/handoff:ro \
              -v promtail_positions:/tmp \
              grafana/promtail:2.9.8 \
              -config.file=/etc/promtail/promtail-config.yml